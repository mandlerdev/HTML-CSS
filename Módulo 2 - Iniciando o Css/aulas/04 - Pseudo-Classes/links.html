<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        a {
            color: red;
            text-decoration: none;
            font-weight: bold;
        }

        a:visited {
            color: red;
        }

        a:hover{
            text-decoration: underline;
            color: blue;
        }

        a:active {
            color: yellow;
        }

        a::after {
            text-decoration: none;
            font-weight: normal;
            color: darkgray;
        }

        .especial {
            background-color: darkred;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Personalizando links</h1>
    <ul>
        <a href="https://github.com/mandlerdev" target="_blank" class="especial">
            <li>GitHub repo</li>
        </a>
        <a href="https://youtube.com/cursoemvideo">
            <li>Canal do Youtube</li>
        </a>
        <a href="https://www.cursoemvideo.com.br">
            <li>Site CursoemVideo</li>
        </a>
    </ul>
</body>
</html>
