<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags Html</title>
</head>
<body>
    <h1>Tags em HTML</h1>
    <p>Em HTML5, podemos inserir os elementos da lista a seguir. Passe o mouse sobre os termos para descorbrir <br>
    qual tag deverá utilizar em cada caso.</p>
    <ul type="square">
        <li> <span title="Use a Tag <p>"> Páragrafos </span></li>
        <li> <span title="Use a Tag <h1>"> Títulos </span></li>
        <li> <span title="Use a Tag <img>"> Imagens </span></li>
        <li> <span title="Use a Tag <abbr>"> Abreviações </span></li>
        <li> <span title="Use a Tag <code>"> Códigos </span>-Fonte</li>
        <li> <span title="Use a Tag <ol> e <li>"> Lisas Numeradas </span></li>
        <li> <span title="Use a Tag <ul> e <li>"> Lista com Demarcadores </span></li>
    </ul>
</body>
</html>
