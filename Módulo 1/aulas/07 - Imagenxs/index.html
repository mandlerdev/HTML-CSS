<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML5</title>
</head>
<body>
    <h1>Imagem dinâmica</h1>
    <p>Abra este site em vários dispositivos diferentes ou diminua o zoom</p>
    <picture>
        <source media="(min-width: 1000px)" srcset="img/foto-g.png" type="image/png">
        <source media="(min-width: 700px)" srcset="img/foto-m.png" type="image/png">
        <img src="img/foto-p.png" alt="flex image">
    </picture>

    <h1>Reproduzindo Audios</h1>
    <h3>Vamos aprender reproduzir audios em HTML5</h3>

    <audio> 
        <source src="midia/guanacast-33.mp3" type="audio/mpeg">
    </audio>
</body>
</html>
