<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formatando Titulos</title>
</head>
<body>
    <h1>Principais formatações</h1>
    <h2>Negrito / Destaque</h2>
    <p>Aqui temos o <b>destaque em negrito</b> usando a tag "B" não semantica</p>
    <p>Já nesta frases podemos <strong>destacar</strong> usando a tag semantica STRONG</p>
    <h2>Itálico / Enfase</h2>
    <p> Nesta, temos um <i>termo em itálico</i> usando a tag nao semantica</p>
    <p> Nesta usamos a <em>tag italica</em> porém semantica</p>
</body>
</html>
